name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mct-it-portal/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: mct-it-portal/backend
        run: npm ci

      - name: Lint backend
        working-directory: mct-it-portal/backend
        run: npm run lint

      - name: Validate Prisma schemas
        working-directory: mct-it-portal/backend
        run: npm run test:schemas

      - name: Run backend unit tests
        working-directory: mct-it-portal/backend
        run: npm run test:unit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mct-it-portal/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: mct-it-portal/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: mct-it-portal/frontend
        run: npm run lint

      - name: Type check
        working-directory: mct-it-portal/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: mct-it-portal/frontend
        run: npm run build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, frontend-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mct_ci
          POSTGRES_PASSWORD: mct_ci_password
          POSTGRES_DB: mct_it_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mct_ci -d mct_it_portal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mct-it-portal/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: mct-it-portal/backend
        run: npm ci

      - name: Deploy PostgreSQL schema
        working-directory: mct-it-portal/backend
        env:
          DATABASE_URL: postgresql://mct_ci:mct_ci_password@localhost:5432/mct_it_portal_ci?schema=public
        run: npx prisma migrate deploy

      - name: Prepare SQLite test database
        working-directory: mct-it-portal/backend
        env:
          DATABASE_URL: file:/tmp/mct-ci.sqlite
        run: |
          rm -f /tmp/mct-ci.sqlite
          touch /tmp/mct-ci.sqlite
          npx prisma migrate deploy

      - name: Run integration tests
        working-directory: mct-it-portal/backend
        run: npm run test:integration

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            mct-it-portal/backend/package-lock.json
            mct-it-portal/frontend/package-lock.json

      - name: Audit backend dependencies
        working-directory: mct-it-portal/backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend dependencies
        working-directory: mct-it-portal/frontend
        run: npm audit --omit=dev --audit-level=high

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [integration]
    steps:
      - name: Verify deployment readiness
        run: echo "All checks passed. Deployment is ready."
